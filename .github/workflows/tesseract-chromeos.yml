name: Tesseract OCR for ChromeOS x86_64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tesseract-chromeos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: alpine:3.21
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache unzip build-base cmake ninja git leptonica-dev pkgconf \
            tesseract-ocr-data-eng binutils zip coreutils file

      - name: Compile Tesseract 5.5.1 from source
        shell: sh
        run: |
          set -eu
          git clone --depth 1 --branch 5.5.1 https://github.com/tesseract-ocr/tesseract.git source
          cmake -S source -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/tesseract \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_TESTS=OFF \
            -DOPENMP_BUILD=OFF
          cmake --build build --parallel 4
          cmake --install build
          /opt/tesseract/bin/tesseract --version

      - name: Bundle musl runtime, libraries and English OCR data
        shell: sh
        run: |
          set -eu
          mkdir -p package/bin package/lib package/tessdata
          cp /opt/tesseract/bin/tesseract package/bin/tesseract.real
          # Resolve DT_NEEDED entries recursively using readelf.
          # This avoids parsing musl ldd output and captures transitive dependencies.
          cp -L /lib/ld-musl-x86_64.so.1 package/lib/ld-musl-x86_64.so.1
          printf '%s\n' /opt/tesseract/bin/tesseract > /tmp/tess-elf-queue
          : > /tmp/tess-elf-seen
          while [ -s /tmp/tess-elf-queue ]; do
            ELF="$(head -n 1 /tmp/tess-elf-queue)"
            sed -i '1d' /tmp/tess-elf-queue
            grep -Fqx "$ELF" /tmp/tess-elf-seen && continue
            printf '%s\n' "$ELF" >> /tmp/tess-elf-seen
            DYNAMIC="$(LC_ALL=C readelf -d "$ELF")"
            printf '%s\n' "$DYNAMIC" | awk -F '[][]' '/\(NEEDED\)/ {print $2}' | while IFS= read -r SONAME; do
              [ -n "$SONAME" ] || continue
              case "$SONAME" in ld-musl-x86_64.so.1|libc.musl-x86_64.so.1) continue ;; esac
              if [ -f "package/lib/$SONAME" ]; then continue; fi
              FOUND=""
              for DIR in /lib /usr/lib /usr/local/lib; do
                if [ -f "$DIR/$SONAME" ]; then FOUND="$DIR/$SONAME"; break; fi
              done
              if [ -z "$FOUND" ]; then
                echo "ERROR: Missing shared library $SONAME required by $ELF" >&2
                exit 1
              fi
              cp -L "$FOUND" "package/lib/$SONAME"
              printf '%s\n' "$FOUND" >> /tmp/tess-elf-queue
            done
          done
          echo "=== BUNDLED LIBRARIES ==="
          ls -lh package/lib/
          for LIB in libleptonica.so.6 libstdc++.so.6 libgcc_s.so.1; do
            test -s "package/lib/$LIB" || { echo "Missing required $LIB" >&2; exit 1; }
          done
          test -s package/lib/ld-musl-x86_64.so.1
          ls -lh package/lib/
          cp /usr/share/tessdata/eng.traineddata package/tessdata/
          cat > package/tesseract <<'EOF'
          #!/bin/sh
          set -eu
          ROOT="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export TESSDATA_PREFIX="$ROOT/tessdata"
          exec "$ROOT/lib/ld-musl-x86_64.so.1" --library-path "$ROOT/lib" "$ROOT/bin/tesseract.real" "$@"
          EOF
          chmod +x package/tesseract
          package/tesseract --version
          package/tesseract --list-langs | grep -x eng

      - name: Package ZIP and SHA-256
        shell: sh
        run: |
          set -eu
          mkdir -p dist
          cd package
          zip -qr ../dist/tesseract-chromeos-x86_64-musl.zip .
          cd ../dist
          sha256sum tesseract-chromeos-x86_64-musl.zip > tesseract-chromeos-x86_64-musl.zip.sha256

      - name: Verify extracted ZIP with only bundled runtime
        shell: sh
        run: |
          set -eu
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          (cd dist && sha256sum -c tesseract-chromeos-x86_64-musl.zip.sha256)
          unzip -q dist/tesseract-chromeos-x86_64-musl.zip -d "$stage"
          env -i PATH=/usr/bin:/bin "$stage/tesseract" --version
          env -i PATH=/usr/bin:/bin TESSDATA_PREFIX=/tessdata \
            /bin/busybox chroot "$stage" /lib/ld-musl-x86_64.so.1 --library-path /lib \
            /bin/tesseract.real --list-langs > "$stage/languages"
          grep -x eng "$stage/languages"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-chromeos-x86_64-musl
          path: dist/
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apk add --no-cache github-cli
          TAG="tesseract-chromeos-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tesseract OCR for ChromeOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Tesseract 5.5.1, x86_64 Linux/musl portable runtime with English traineddata. Built in GitHub Actions; ChromeOS host execution requires validation." \
            --latest=false
