name: Fizz persistent builder readiness gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fizz-builder-readiness.yml'
      - 'scripts/check-fizz-builder-readiness.py'
      - 'tests/test-fizz-builder-readiness.py'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate persistent builder readiness gate
        run: |
          set -euo pipefail
          python3 tests/test-fizz-builder-readiness.py
          mkdir -p reports
          set +e
          python3 scripts/check-fizz-builder-readiness.py --min-free-gib 100 --output reports/github-runner-readiness.json
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then echo "::error::Expected GitHub runner to be blocked by 100 GiB gate, rc=$rc"; exit 1; fi
          echo "PASS: GitHub-hosted runner blocked safely by minimum free space gate"
      - name: Upload readiness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fizz-persistent-builder-readiness
          path: reports/
          if-no-files-found: warn
