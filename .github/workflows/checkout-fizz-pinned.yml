name: Bounded Fizz pinned source checkout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/checkout-fizz-pinned.yml'
      - 'scripts/checkout-fizz-pinned.sh'

permissions:
  contents: read

jobs:
  checkout-pinned:
    runs-on: [self-hosted, Linux, X64, chromeos-linux]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Record runner capacity before limited checkout
        run: |
          set -euo pipefail
          df -h .
          mkdir -p reports
          echo "This probe syncs only three named projects and has a 13-minute command timeout; disk usage is measured, not hard-capped."
      - name: Initialize pinned manifest and sync selected projects
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 13m bash scripts/checkout-fizz-pinned.sh
      - name: Upload checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fizz-16700-66-0-bounded-checkout
          path: reports/
          if-no-files-found: warn
