name: Fizz SDK bootstrap feasibility gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fizz-sdk-bootstrap-feasibility.yml'
      - 'scripts/assess-fizz-sdk-bootstrap.py'
      - 'scripts/run-fizz-sdk-bootstrap-feasibility.sh'

permissions:
  contents: read

jobs:
  sdk-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned source and runner feasibility
        run: timeout --signal=TERM --kill-after=30s 16m bash scripts/run-fizz-sdk-bootstrap-feasibility.sh
      - name: Upload SDK feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fizz-16700-66-0-sdk-bootstrap-feasibility
          path: reports/
          if-no-files-found: warn
