name: Fizz minimal no-SDK build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/fizz-minimal-no-sdk-build.yml'
      - 'scripts/inventory-fizz-public-artifacts.py'
      - 'scripts/build-fizz-minimal-no-sdk.sh'
      - 'tests/fizz-hello.c'
      - 'scripts/audit-fizz-elf-abi.py'
      - 'tests/test-fizz-abi-audit.py'
      - 'tests/fizz-static-probe.c'
      - 'scripts/audit-fizz-static-elf.py'
      - 'tests/test-fizz-static-probe.py'
      - 'tests/fizz-runtime-capabilities.c'
      - 'tests/test-fizz-runtime-capabilities.py'
      - 'scripts/fizz-stage-github-artifact.sh'
      - 'scripts/fizz-test-on-chromeos.sh'
      - 'scripts/fizz-crostini-monitor.py'
      - 'scripts/fizz-host-worker.py'
      - 'scripts/install-fizz-crostini-timer.sh'
      - 'systemd/fizz-crostini-monitor.service'
      - 'systemd/fizz-crostini-monitor.timer'
      - 'tests/test_fizz_automation.py'

permissions:
  contents: write

jobs:
  minimal-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone host compiler and ELF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils file musl-tools
      - name: Validate Crostini and ChromeOS shell scripts
        run: bash -n scripts/fizz-stage-github-artifact.sh scripts/fizz-test-on-chromeos.sh
      - name: Verify unattended monitor and host-worker scripts
        run: |
          bash -n scripts/install-fizz-crostini-timer.sh
          python3 -m py_compile scripts/fizz-crostini-monitor.py scripts/fizz-host-worker.py
          python3 -m unittest discover -s tests -p 'test_fizz_automation.py' -v
      - name: Test ELF ABI parser
        run: python3 tests/test-fizz-abi-audit.py
      - name: Discover public ChromiumOS artifacts and compile standalone smoke test
        run: timeout --signal=TERM --kill-after=15s 8m bash scripts/build-fizz-minimal-no-sdk.sh
      - name: Upload build binary and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fizz-minimal-no-sdk-host-abi
          path: |
            output/
            reports/
          if-no-files-found: warn

      - name: Package successful build for long-term GitHub Release storage
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p release
          zip -q -r "release/fizz-build-${GITHUB_RUN_NUMBER}.zip" output reports
          cd release
          sha256sum "fizz-build-${GITHUB_RUN_NUMBER}.zip" > "fizz-build-${GITHUB_RUN_NUMBER}.zip.sha256"
      - name: Publish versioned GitHub Release assets
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fizz-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fizz build ${GITHUB_RUN_NUMBER}" \
            --notes "Successful GitHub Actions Fizz build. Source commit: ${GITHUB_SHA}. Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Includes compiled output, diagnostic reports, and SHA-256 checksum." \
            --latest=false
